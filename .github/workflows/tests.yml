name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: composer test

      - name: PHPCS
        run: composer phpcs

  package:
    name: Build plugin ZIP
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist/plan-wordpress-sso
          cp plan-wordpress-sso.php uninstall.php README.md readme.txt LICENSE dist/plan-wordpress-sso/
          cp -R src dist/plan-wordpress-sso/src
          cd dist
          zip -r ../plan-wordpress-sso.zip plan-wordpress-sso

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plan-wordpress-sso
          path: plan-wordpress-sso.zip
